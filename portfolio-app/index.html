<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Portfolio Dashboard</title>
    <style>
      :root {
        --bg: #07090f;
        --surface: #0d1117;
        --surface2: #111827;
        --border: #1f2937;
        --border2: #374151;
        --text: #f1f5f9;
        --text2: #94a3b8;
        --text3: #64748b;
        --cyan: #22d3ee;
        --cyan-dim: rgba(34,211,238,0.15);
        --purple: #a78bfa;
        --purple-dim: rgba(167,139,250,0.15);
        --green: #4ade80;
        --green-dim: rgba(74,222,128,0.15);
        --red: #f87171;
        --red-dim: rgba(248,113,113,0.15);
        --orange: #fb923c;
        --orange-dim: rgba(251,146,60,0.15);
        --indigo: #818cf8;
        --indigo-dim: rgba(129,140,248,0.15);
        --radius: 10px;
        --radius-sm: 6px;
        --radius-lg: 14px;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

      /* Layout */
      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 0; z-index: 100; }
      .app-header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 16px; height: 60px; }
      .app-title { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; white-space: nowrap; }
      .app-title span { color: var(--cyan); }
      .app-content { max-width: 1400px; margin: 0 auto; padding: 24px 20px; width: 100%; flex: 1; }

      /* Nav tabs */
      .tab-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
      .tab-nav::-webkit-scrollbar { display: none; }
      .tab-btn { padding: 8px 16px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
      .tab-btn:hover { background: var(--surface2); color: var(--text); }
      .tab-btn.active { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(34,211,238,0.3); }

      /* KPI Cards */
      .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
      .kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); margin-bottom: 6px; }
      .kpi-value { font-size: 26px; font-weight: 900; line-height: 1.1; }
      .kpi-sub { font-size: 12px; font-weight: 600; margin-top: 4px; }

      /* Cards */
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
      .card-lg { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
      .card-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 0 0 14px 0; }

      /* Sections */
      .section { margin-bottom: 24px; }
      .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
      .section-title { font-size: 16px; font-weight: 800; color: var(--text); margin: 0; }

      /* Division card */
      .div-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden; }
      .div-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
      .div-header:hover { background: var(--surface2); }
      .div-name { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
      .div-stats { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .div-stat { font-size: 12px; color: var(--text2); }
      .div-stat strong { color: var(--text); }
      .div-body { border-top: 1px solid var(--border); }
      .chevron { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
      .chevron.open { transform: rotate(90deg); }

      /* Holdings table */
      .holdings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .holdings-table th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); background: var(--surface2); border-bottom: 1px solid var(--border); white-space: nowrap; }
      .holdings-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      .holdings-table tr:last-child td { border-bottom: none; }
      .holdings-table tr:hover td { background: rgba(255,255,255,0.02); }
      .holdings-table td.right { text-align: right; }
      .holdings-table td.center { text-align: center; }
      .holdings-table .num { font-variant-numeric: tabular-nums; font-weight: 600; }
      /* "+₹13,100" was wrapping after the sign in narrow columns. */
      .num, .gs-table .num { white-space: nowrap; }

      /* Platform badges */
      .platform-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
      .platform-kite { background: rgba(34,211,238,0.12); color: #22d3ee; border: 1px solid rgba(34,211,238,0.25); }
      .platform-groww { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.25); }
      .platform-indmoney { background: rgba(167,139,250,0.12); color: #a78bfa; border: 1px solid rgba(167,139,250,0.25); }
      .platform-bank { background: rgba(251,146,60,0.12); color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
      .platform-other { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); }

      /* Asset type labels */
      .asset-type { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; background: var(--surface2); color: var(--text3); }

      /* Sector & market-cap badges — color/borderColor set inline per category */
      .sector-badge, .cap-badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 99px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; border: 1px solid currentColor; background: rgba(255,255,255,0.03); }
      .cap-badge { font-variant: small-caps; }

      /* Form elements */
      .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
      .form-group { display: flex; flex-direction: column; gap: 4px; }
      .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); }
      .input { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: inherit; width: 100%; transition: border-color 0.15s; }
      .input:focus { outline: none; border-color: var(--cyan); background: #0f1724; }
      .input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
      .input::placeholder { color: var(--text3); }
      .input-sm { padding: 6px 8px; font-size: 12px; }
      select.input { cursor: pointer; }

      /* Buttons */
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: inherit; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-sm { padding: 5px 10px; font-size: 12px; }
      .btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 4px; }
      .btn-primary { background: var(--cyan); color: #0a0f1c; }
      .btn-primary:hover:not(:disabled) { background: #06b6d4; }
      .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
      .btn-secondary:hover:not(:disabled) { background: var(--border); }
      .btn-success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
      .btn-success:hover:not(:disabled) { background: rgba(74,222,128,0.25); }
      .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
      .btn-danger:hover:not(:disabled) { background: rgba(248,113,113,0.25); }
      .btn-ghost { background: transparent; color: var(--text2); }
      .btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
      .btn-icon { padding: 4px 6px; background: transparent; color: var(--text3); border: none; cursor: pointer; border-radius: 4px; font-size: 13px; }
      .btn-icon:hover { background: var(--surface2); color: var(--text); }

      /* Inline edit */
      .editable { cursor: text; border-bottom: 1px dashed transparent; transition: border-color 0.15s; }
      .editable:hover { border-bottom-color: var(--border2); }

      /* Profit/Loss colors */
      .pos { color: var(--green); }
      .neg { color: var(--red); }
      .neu { color: var(--text2); }

      /* Progress bar */
      .progress-bar { height: 4px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }

      /* Tags row */
      .tags { display: flex; gap: 6px; flex-wrap: wrap; }

      /* Divider */
      .divider { height: 1px; background: var(--border); margin: 16px 0; }

      /* Goal seek table */
      .gs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .gs-table th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); background: var(--surface2); border-bottom: 1px solid var(--border); }
      .gs-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      .gs-table tr:last-child td { border-bottom: none; }
      .gs-table tr:hover td { background: rgba(255,255,255,0.02); }
      .gs-table td.right { text-align: right; }

      /* Inline action group */
      /* Hidden means hidden: opacity:0 alone left these fully clickable, so on a phone
         (no hover, so never revealed) a tap on apparently blank header space could hit
         "Delete division". pointer-events goes with the opacity. */
      .action-group { display: flex; gap: 4px; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
      tr:hover .action-group, .div-header:hover .action-group, .sub-row:hover .action-group,
      .action-group:focus-within { opacity: 1; pointer-events: auto; }
      /* Touch devices never hover, so the controls must simply be present. */
      @media (hover: none) {
        .action-group { opacity: 1; pointer-events: auto; }
      }

      /* Keyboard focus was invisible everywhere — there was no :focus-visible rule at all. */
      :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 3px; }
      .input:focus-visible { outline-offset: 0; }

      /* Collapsible add form */
      .add-holding-panel { background: var(--surface2); border-top: 1px solid var(--border); padding: 14px 16px; }

      /* Search dropdown */
      .search-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); z-index: 50; max-height: 200px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
      .search-item { padding: 8px 10px; font-size: 12px; cursor: pointer; color: var(--text); }
      .search-item:hover { background: var(--surface); }
      .relative { position: relative; }

      /* Misc */
      .text-sm { font-size: 12px; }
      .text-xs { font-size: 11px; }
      .text-muted { color: var(--text2); }
      .text-dim { color: var(--text3); }
      .font-bold { font-weight: 700; }
      .font-black { font-weight: 900; }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-wrap { flex-wrap: wrap; }
      .items-center { align-items: center; }
      .gap-1 { gap: 4px; }
      .gap-2 { gap: 8px; }
      .gap-3 { gap: 12px; }
      .gap-4 { gap: 16px; }
      .flex-1 { flex: 1; }
      .ml-auto { margin-left: auto; }
      .mr-2 { margin-right: 8px; }
      .mb-2 { margin-bottom: 8px; }
      .mb-3 { margin-bottom: 12px; }
      .mb-4 { margin-bottom: 16px; }
      .mt-2 { margin-top: 8px; }
      .mt-3 { margin-top: 12px; }
      .mt-4 { margin-top: 16px; }
      .w-full { width: 100%; }
      .hidden { display: none; }
      .spin { animation: spin 1s linear infinite; display: inline-block; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

      /* FIRE calc */
      .fire-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
      .fire-result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
      .fire-result-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin-bottom: 6px; }
      .fire-result-value { font-size: 22px; font-weight: 900; color: var(--text); }
      .fire-result-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
      .fire-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }

      /* Analytics */
      .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .metric-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; }
      .metric-label { font-size: 11px; color: var(--text3); font-weight: 600; margin-bottom: 4px; }
      .metric-value { font-size: 20px; font-weight: 800; }

      /* Modal */
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
      .modal-box { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 540px; }
      .modal-title { font-size: 16px; font-weight: 800; margin: 0 0 18px 0; }

      /* Header actions */
      .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
      .header-hint { font-size: 11px; color: var(--text3); white-space: nowrap; }
      .btn-sync { min-width: 96px; justify-content: center; }

      /* Banners — inline, dismissible, above the content they describe */
      .banner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius);
                border: 1px solid var(--border); background: var(--surface); margin-bottom: 16px; font-size: 13px; line-height: 1.45; }
      .banner-error { border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.07); }
      .banner-error > span:first-child { color: var(--red); }
      .banner-warn { border-color: rgba(251,146,60,0.35); background: rgba(251,146,60,0.07); }
      .banner-warn > span:first-child { color: var(--orange); }

      /* Toasts */
      .toast-stack { position: fixed; bottom: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column;
                     gap: 8px; width: min(92vw, 380px); }
      .toast { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: var(--radius);
               border: 1px solid var(--border2); background: var(--surface2); box-shadow: 0 10px 30px rgba(0,0,0,0.55);
               animation: toast-in 0.18s ease-out; }
      .toast-icon { flex-shrink: 0; width: 20px; height: 20px; border-radius: 99px; border: 1px solid;
                    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
      .toast-msg { font-size: 13px; font-weight: 700; color: var(--text); }
      .toast-detail { font-size: 11px; color: var(--text2); margin-top: 2px; word-break: break-word; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      /* Loading skeletons */
      .skeleton { border-radius: 4px; background: linear-gradient(90deg, var(--surface2) 25%, #1b2534 37%, var(--surface2) 63%);
                  background-size: 400% 100%; animation: shimmer 1.3s ease-in-out infinite; }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

      /* Empty states */
      .empty-state { background: var(--surface); border: 1px dashed var(--border2); border-radius: var(--radius-lg);
                     padding: 32px 24px; text-align: center; }
      .empty-state-icon { font-size: 28px; color: var(--text3); line-height: 1; margin-bottom: 10px; }
      .empty-state-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
      .empty-state-body { font-size: 13px; color: var(--text2); max-width: 460px; margin: 0 auto 16px; line-height: 1.5; }

      /* Export / backup rows */
      .data-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid var(--border);
                  border-radius: var(--radius); background: var(--surface2); margin-bottom: 10px; }
      .data-row-icon { font-size: 20px; line-height: 1.2; flex-shrink: 0; }
      .data-row-title { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
      .data-row-body { font-size: 12px; color: var(--text2); line-height: 1.5; }
      .restore-confirm { border: 1px solid rgba(248,113,113,0.4); background: rgba(248,113,113,0.07);
                         border-radius: var(--radius); padding: 14px; margin-top: 4px; }

      /* Horizontal-scroll affordance for wide tables */
      .scroll-x { overflow-x: auto; }
      .scroll-x-hint { position: relative; }
      .scroll-x-hint::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 26px;
                              pointer-events: none; background: linear-gradient(to right, rgba(13,17,23,0), rgba(13,17,23,0.92)); }

      /* Goal Seek stacked rows (phones) — see GoalSeekPanel's StackedRow */
      .gs-stack-row { padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .gs-stack-row:last-child { border-bottom: none; }
      .gs-stack-head { display: flex; align-items: baseline; gap: 8px; }
      .gs-stack-name { font-size: 13px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
      .gs-stack-amount { font-size: 12px; color: var(--orange); white-space: nowrap; }
      .gs-stack-amount strong { color: var(--orange); }
      .gs-stack-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 11px; color: var(--text2); }

      /* Broker ledger: the net-profit equation spelled out */
      .broker-equation { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
                         font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums;
                         line-height: 1.9; }

      /* Cash-flow reconciliation lines */
      .reconcile-line { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; padding-top: 12px;
                        border-top: 1px solid var(--border); font-size: 12px; color: var(--text2);
                        font-variant-numeric: tabular-nums; }
      .reconcile-eq { white-space: nowrap; }

      /* Segmented control (goal-seek modes) */
      .mode-switch { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
      .mode-btn { border: none; background: transparent; color: var(--text2); font-family: inherit; font-size: 12px; font-weight: 700;
                  padding: 5px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
      .mode-btn:hover { color: var(--text); }
      .mode-btn.active { background: var(--indigo-dim); color: var(--indigo); box-shadow: inset 0 0 0 1px rgba(129,140,248,0.35); }

      /* Sortable table headers */
      .sortable { cursor: pointer; user-select: none; white-space: nowrap; }
      .sortable:hover { color: var(--text); }
      .sort-arrow { font-size: 9px; margin-left: 3px; color: var(--cyan); }

      /* Responsive */
      @media (max-width: 860px) {
        /* Labels drop out before the buttons start wrapping onto a second line */
        .btn-label { display: none; }
        .btn-sync { min-width: 0; }
      }

      /* The six tabs stop fitting on one line well before the 640px phone breakpoint,
         and .tab-nav's overflow:auto hid the rest with no scrollbar. Wrap from here. */
      @media (max-width: 925px) {
        .app-header-inner { flex-wrap: wrap; height: auto; padding: 8px 0; row-gap: 8px; }
        .tab-nav { order: 3; flex: 0 0 100%; flex-wrap: wrap; overflow: visible; }
        /* Wide tables lose their least useful columns here rather than slicing the
           action buttons in half between 861 and 925px. */
        .col-optional { display: none; }
      }
      @media (max-width: 640px) {
        .app-header { padding: 0 12px; }
        .app-header-inner { gap: 8px; height: auto; padding: 8px 0; flex-wrap: wrap; }
        .app-content { padding: 16px 12px; }
        .kpi-row { grid-template-columns: 1fr 1fr; }
        /* The bank/net-worth card reads better full width than squeezed into a column */
        .kpi-row > .kpi-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
        .kpi-value { font-size: 22px; }

        /* The tab bar used to scroll off screen with no hint that more tabs existed.
           Wrapping shows all of them, which matters more than a single-line header. */
        /* flex-basis beats width on a flex item, so the base `flex: 1` has to be
           overridden here or the nav shares the title's line instead of wrapping. */
        .tab-nav { order: 3; flex: 0 0 100%; flex-wrap: wrap; gap: 4px; overflow: visible; }
        .tab-btn { padding: 6px 10px; font-size: 12px; }
        .header-actions { margin-left: auto; }

        /* Division money used to be hidden entirely on mobile (`display:none`), so a
           phone showed no invested/current/P&L anywhere. Stack it under the name. */
        .div-stats { display: flex; gap: 10px; font-size: 11px; flex-wrap: wrap; }
        .div-header { flex-wrap: wrap; row-gap: 6px; }
        .div-name { flex: 1 1 auto; min-width: 0; }
        .holdings-table th, .holdings-table td { padding: 8px 9px; }
        .holdings-table { font-size: 12px; }

        /* iOS Safari zooms the whole page when a focused input is under 16px. */
        .input, .input-sm, select.input, input[type="number"], input[type="search"], input[type="text"] { font-size: 16px; }

        /* Touch targets. The smallest was a 14x17px collapse chevron. */
        .btn-icon { min-width: 40px; min-height: 40px; padding: 8px; font-size: 15px; }
        .btn-xs, .btn-sm { min-height: 40px; }
        .header-actions .btn-sm { min-width: 44px; justify-content: center; }
        input[type="checkbox"] { width: 20px; height: 20px; }
        .tab-btn { min-height: 38px; }
        .mode-btn { min-height: 38px; padding: 8px 14px; }
        .action-group { gap: 6px; }

        /* Sliders were a 16px-tall hit area. */
        input[type="range"] { height: 40px; }
        input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; }

        /* Tables scroll on a phone; give the edge a cue. An inset shadow is painted on
           the padding box, so unlike ::after it doesn't scroll away with the content. */
        .scroll-x { box-shadow: inset -14px 0 12px -12px rgba(0,0,0,0.9); }

        /* The action column is last, so it sat off-screen at rest. Pin it. */
        .holdings-table th:last-child, .holdings-table td:last-child { position: sticky; right: 0; }
        .holdings-table td:last-child { background: var(--surface); box-shadow: -6px 0 8px -6px rgba(0,0,0,0.7); }
        .holdings-table th:last-child { background: var(--surface2); }

        /* An inline-editable value needs to look editable when there's no hover. */
        .editable { border-bottom-color: var(--border2); }

        /* Goal Seek's 5 columns squeezed until amounts clipped mid-number
           ("₹2.77L" → "₹2.77"). Let the table keep its natural width and scroll. */
        .gs-table { font-size: 12px; }
        .gs-table th, .gs-table td { padding: 9px 8px; white-space: nowrap; }
        /* On a phone, invested/current/P&L matter more than units, avg price,
           platform and asset type — drop those so the money fits on screen. */
        .col-optional { display: none; }
        /* Secondary header meta that would otherwise crowd a phone header row */
        .hide-sm { display: none !important; }
        .toast-stack { right: 8px; left: 8px; width: auto; bottom: 8px; }
        .data-row { flex-wrap: wrap; }
        .data-row > div:last-child { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
